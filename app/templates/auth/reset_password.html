{% extends 'base.html' %}
{% block title %}Reset Password - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 gsap-fade-in">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-key text-primary-custom fs-1 mb-3"></i>
                    <h3 class="fw-bold">Create New Password</h3>
                    <p class="text-secondary small">Please enter your new password below.</p>
                </div>
                
                <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-medium">New Password</label>
                        <input type="password" class="form-control form-control-custom" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Confirm Password</label>
                        <input type="password" class="form-control form-control-custom" required>
                    </div>
                    <button type="submit" class="btn btn-premium w-100">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
