{% extends 'base.html' %}
{% block title %}Forgot Password - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 gsap-fade-in">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-lock text-primary-custom fs-1 mb-3"></i>
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-secondary small">Enter your email address to receive a password reset link.</p>
                </div>
                
                <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-custom" required>
                    </div>
                    <button type="submit" class="btn btn-premium w-100 mb-4">Send Reset Link</button>
                    
                    <div class="text-center small">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
