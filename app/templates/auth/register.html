{% extends 'base.html' %}
{% block title %}Register - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6 gsap-fade-in">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-doctor text-primary-custom fs-1 mb-3"></i>
                    <h3 class="fw-bold">Create an Account</h3>
                    <p class="text-secondary small">Join ColonSightAI for advanced histopathology analysis.</p>
                </div>
                
                <form action="{{ url_for('auth.register') }}" method="POST" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">First Name</label>
                            <input type="text" name="first_name" class="form-control form-control-custom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Last Name</label>
                            <input type="text" name="last_name" class="form-control form-control-custom" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="name@institution.edu" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Organization / Hospital</label>
                        <input type="text" name="organization" class="form-control form-control-custom">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Password</label>
                        <input type="password" name="password" class="form-control form-control-custom" placeholder="Create a strong password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-custom" placeholder="Confirm your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-premium w-100 mb-4">Sign Up</button>
                    
                    <div class="text-center small text-secondary">
                        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold">Log In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
