{% extends 'base.html' %}
{% block title %}Settings - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row">
        <div class="col-md-3 mb-4 gsap-fade-in">
            <div class="glass-card p-3">
                <ul class="nav flex-column nav-pills">
                    <li class="nav-item"><a class="nav-link active" href="#">General</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Notifications</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Security</a></li>
                </ul>
            </div>
        </div>
        <div class="col-md-9 gsap-fade-in">
            <div class="glass-card p-4">
                <h4 class="fw-bold mb-4">General Settings</h4>
                <form action="{{ url_for('dashboard.settings') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Timezone</label>
                        <select name="timezone" class="form-select form-control-custom">
                            <option>UTC (Coordinated Universal Time)</option>
                            <option>EST (Eastern Standard Time)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Default Result View</label>
                        <select name="default_view" class="form-select form-control-custom">
                            <option>Grad-CAM + Confidence</option>
                            <option>Confidence Only</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-premium mt-3">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
