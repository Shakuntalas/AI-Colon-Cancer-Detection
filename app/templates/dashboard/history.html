{% extends 'base.html' %}
{% block title %}Prediction History - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 gsap-fade-in">
        <h2 class="fw-bold mb-0">Prediction History</h2>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-premium-outline"><i class="fa-solid fa-arrow-left me-2"></i>Back</a>
    </div>

    <div class="glass-card p-4 gsap-fade-in">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr class="text-secondary small">
                        <th>ID</th>
                        <th>Date</th>
                        <th>Result</th>
                        <th>Confidence</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#1024</td>
                        <td>Oct 24, 2023 - 10:42 AM</td>
                        <td><span class="badge bg-danger-subtle text-danger border border-danger">Adenocarcinoma</span></td>
                        <td>98.5%</td>
                        <td>
                            <a href="{{ url_for('prediction.result', prediction_id=1024) }}" class="btn btn-sm btn-light me-1">View Details</a>
                            <a href="{{ url_for('prediction.gradcam', prediction_id=1024) }}" class="btn btn-sm btn-light">Grad-CAM</a>
                        </td>
                    </tr>
                    <!-- Add more rows here -->
                </tbody>
            </table>
        </div>
        
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>
    </div>
</div>
{% endblock %}
