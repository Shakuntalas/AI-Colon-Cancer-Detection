{% extends 'base.html' %}
{% block title %}Profile - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 gsap-fade-in">
            <div class="glass-card p-4 text-center mb-4">
                <div class="bg-primary-custom text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                    DR
                </div>
                <h3 class="fw-bold">Dr. John Doe</h3>
                <p class="text-secondary mb-0">Pathologist at General Hospital</p>
            </div>
            
            <div class="glass-card p-4">
                <h4 class="fw-bold mb-4">Edit Profile</h4>
                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">First Name</label>
                            <input type="text" class="form-control form-control-custom" value="John">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Last Name</label>
                            <input type="text" class="form-control form-control-custom" value="Doe">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Email Address</label>
                        <input type="email" class="form-control form-control-custom" value="john.doe@example.com">
                    </div>
                    <button type="button" class="btn btn-premium">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
