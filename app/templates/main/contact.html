{% extends 'base.html' %}
{% block title %}Contact - ColonSightAI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center mb-5 gsap-fade-in">
            <h1 class="display-5 fw-bold mb-3">Get in Touch</h1>
            <p class="text-secondary mx-auto">Have questions about our platform or research? We'd love to hear from you.</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8 gsap-fade-in">
            <div class="glass-card p-5">
                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">First Name</label>
                            <input type="text" class="form-control form-control-custom">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-medium">Last Name</label>
                            <input type="text" class="form-control form-control-custom">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Email Address</label>
                        <input type="email" class="form-control form-control-custom">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Message</label>
                        <textarea class="form-control form-control-custom" rows="5"></textarea>
                    </div>
                    <button type="button" class="btn btn-premium w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
